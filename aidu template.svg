<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="1100"
     viewBox="0 0 800 1100">

<style>
.border{fill:none;stroke:#000;stroke-width:1.5}
.heavy{fill:none;stroke:#000;stroke-width:2.5}
.txt{font-family:Arial,Helvetica,sans-serif;font-size:11px}
.small{font-family:Arial,Helvetica,sans-serif;font-size:9px}
.title{font-family:Arial,Helvetica,sans-serif;font-size:24px;font-weight:bold}
.head{font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:bold}
</style>

<!-- OUTER BORDER -->
<rect x="20" y="20" width="760" height="1060" class="border"/>

<!-- TOP STRIP -->
<line x1="20" y1="55" x2="780" y2="55" class="border"/>

<text x="35" y="42" class="head">AD 2 - ICAO - X - XX</text>
<text x="400" y="42" text-anchor="middle" class="head">AERODROME NAME</text>
<text x="740" y="42" text-anchor="end" class="head">UK MIL AIP</text>

<!-- HEADER BOX -->
<rect x="40" y="80" width="720" height="90" class="border"/>

<line x1="40" y1="125" x2="760" y2="125" class="border"/>

<text x="50" y="105" class="txt">Elev</text>
<text x="140" y="105" class="txt">Var</text>
<text x="220" y="105" class="txt">ARP</text>
<text x="520" y="105" class="txt">Date</text>

<text x="50" y="150" class="txt">GND</text>
<text x="170" y="150" class="txt">TWR</text>
<text x="320" y="150" class="txt">APP</text>
<text x="470" y="150" class="txt">ATIS</text>

<!-- CHART TITLE -->
<text x="60" y="220" class="title">AERODROME</text>

<!-- MAIN CHART AREA -->
<rect x="40" y="190" width="720" height="560" class="border"/>

<!-- COORDINATE MARKS -->
<g class="small">
  <text x="45" y="185">N00 00</text>
  <text x="705" y="185">E000 00</text>
  <text x="45" y="765">N00 00</text>
  <text x="705" y="765">E000 00</text>
</g>

<!-- PLACEHOLDER RUNWAY -->
<g transform="translate(400,470) rotate(-30)">
  <rect x="-25" y="-220" width="50" height="440"
        fill="white" stroke="black" stroke-width="2"/>
  <line x1="0" y1="-210" x2="0" y2="210"
        stroke="black" stroke-width="2"
        stroke-dasharray="20 15"/>

  <text x="0" y="-235" text-anchor="middle" class="head">XX</text>
  <text x="0" y="255" text-anchor="middle" class="head">YY</text>
</g>

<!-- TAXIWAYS PLACEHOLDER -->
<path d="M240 500 C290 500 330 460 360 420"
      fill="none" stroke="#000" stroke-width="10"/>

<path d="M470 420 C520 420 560 450 590 520"
      fill="none" stroke="#000" stroke-width="10"/>

<!-- APRON -->
<rect x="270" y="320" width="120" height="80"
      fill="none" stroke="black"/>

<text x="330" y="365" text-anchor="middle" class="txt">APRON</text>

<!-- SCALE -->
<g transform="translate(60 700)">
  <line x1="0" y1="0" x2="150" y2="0"
        stroke="black" stroke-width="2"/>
  <line x1="0" y1="-8" x2="0" y2="8" stroke="black"/>
  <line x1="75" y1="-8" x2="75" y2="8" stroke="black"/>
  <line x1="150" y1="-8" x2="150" y2="8" stroke="black"/>

  <text x="-5" y="25" class="small">0</text>
  <text x="65" y="25" class="small">500 m</text>
  <text x="135" y="25" class="small">1000 m</text>
</g>

<!-- THRESHOLD TABLE -->
<rect x="40" y="760" width="720" height="95" class="border"/>

<text x="50" y="785" class="head">THRESHOLD COORDINATES</text>

<line x1="40" y1="800" x2="760" y2="800" class="border"/>

<text x="55" y="825" class="txt">RWY</text>
<text x="160" y="825" class="txt">LDA</text>
<text x="300" y="825" class="txt">APP LGT</text>
<text x="500" y="825" class="txt">RWY LGT</text>

<!-- NOTES -->
<rect x="40" y="870" width="720" height="160" class="border"/>

<text x="50" y="895" class="head">NOTES</text>

<text x="55" y="925" class="txt">1.</text>
<text x="55" y="950" class="txt">2.</text>
<text x="55" y="975" class="txt">3.</text>
<text x="55" y="1000" class="txt">4.</text>

<!-- FOOTER -->
<line x1="20" y1="1045" x2="780" y2="1045" class="border"/>

<text x="35" y="1068" class="title">AERODROME NAME</text>
<text x="745" y="1068" text-anchor="end" class="title">AERODROME</text>

</svg>